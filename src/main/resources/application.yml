spring:
  config:
    import:
      # 独立的首个配置文档先强制加载本机 .env，使后续文档解析 Nacos URI 时能够取得全部 NACOS_* 参数。
      - file:./.env[.properties]

---

spring:
  application:
    name: kewei-ai-agent
  config:
    import:
      # 不使用 optional 前缀：Nacos 不可用或目标配置不存在时终止启动，避免应用误连其他数据源。
      - nacos:${NACOS_DATA_ID}
  cloud:
    nacos:
      # 这些值必须由本机 .env 提供，代码与构建产物中不包含真实地址和认证信息。
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      config:
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
        # 官方解析器不展开 import URI 的占位符；name 供启动期解析器取得已由 Spring Environment 展开的 Data ID。
        name: ${NACOS_DATA_ID}
        # 连接参数改变后通过重启应用生效，禁止在运行期直接替换数据源或 Redis 连接配置。
        refresh-enabled: false
  profiles:
    active: local,dashscope
  session:
    data:
      redis:
        # Spring Boot 4 使用 data.redis 层级配置 Redis Session，并以独立命名空间隔离认证会话。
        namespace: kewei:auth:session
        repository-type: default
  autoconfigure:
    exclude:
      # 项目只使用自建 MySQL 账号与 Redis Session，禁止生成默认内存用户及随机开发密码。
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration
  ai:
    model:
      chat: dashscope
      embedding:
        text: dashscope
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      chat:
        options:
          model: qwen3.5-plus
          multi-model: true
          # qwen3.5-plus 默认开启长思考；关闭默认思考，避免关键词增强等同步短任务长时间阻塞。
          enable-thinking: false
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    mcp:
      client:
        annotation-scanner:
          enabled: false
#        sse:
#          connections:
#            server1:
#                url: http://localhost:8129
        stdio:
          servers-configuration: classpath:mcp-servers.json
          connections:
            kewei-image-search-mcp-server:
              command: java
              args:
                - -Dspring.ai.mcp.server.stdio=true
                - -Dspring.main.web-application-type=none
                - -Dlogging.level.root=OFF
                - -Dspring.main.banner-mode=off
                - -jar
                - kewei-image-search-mcp-server/target/kewei-image-search-mcp-server-0.0.1-SNAPSHOT.jar
              env:
                # 主应用先从 Nacos 解析 Pexels Key，再通过子进程环境传递，避免密钥进入仓库或 JVM 命令行。
                PEXELS_API_KEY: ${pexels.api-key}
        request-timeout: 200s

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch


server:
  port: 8123
  servlet:
    context-path: /api
    session:
      # Redis HttpSession 连续 24 小时没有收到有效请求后失效。
      timeout: 24h
      cookie:
        # 认证 Cookie 使用独立名称，避免与同域下其他应用的默认 JSESSIONID 冲突。
        name: KEWEI_SESSION
        http-only: true
        # 本地 HTTP 开发环境必须为 false；生产环境通过环境变量强制设置为 true。
        secure: ${SESSION_COOKIE_SECURE:false}
        # 前后端同站部署及本地不同端口场景使用 lax；跨站部署时由生产环境显式调整。
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        # 持久化 Cookie 关闭浏览器后继续保留，但服务端仍会执行 24 小时不活跃和 7 天绝对期限校验。
        max-age: 7d

app:
  security:
    session:
      # 绝对有效期独立于不活跃期限；达到 7 天后即使持续访问也必须重新登录。
      absolute-timeout: 7d
  cors:
    # 凭据请求不允许通配来源，生产环境使用逗号分隔的明确前端 Origin。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.kiwi.keweiaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn

# 即使排障时把根日志切到 DEBUG，也禁止 Nacos 加载器输出包含数据库与 Redis 密码的配置全文。
logging:
  level:
    com.alibaba.cloud.nacos.configdata.NacosConfigDataLoader: INFO
